[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoqy-core"
version = "2.2.0"
description = "Quantum-yield calculation software"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Jorn D. Steen", email = "jornsteen@outlook.com" },
  { name = "Alfredo Bellisario", email = "alfredo.bellisario@physics.uu.se" },
  { name = "Stefano Crespi", email = "stefano.crespi@kemi.uu.se" }
]
dependencies = [
  "numpy>=2.2.2",
  "scipy>=1.15.1",
  "pandas>=2.2.3",
  "matplotlib>=3.10.0"
]
keywords = ["photochemistry", "quantum yield", "spectroscopy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry"
]

[project.optional-dependencies]
power-gui = [
  "dash>=2.18,<4",
  "plotly>=5.24,<7"
]

[project.urls]
Homepage = "https://github.com/CrespiLab/autoQY"

[project.scripts]
autoqy-core = "autoqy_core.cli:main"
autoqy-power-gui = "autoqy_core.tools.power_gui:main"
autoqy-smoother-gui = "autoqy_core.tools.smoother_gui:main"
autoqy-analysis-gui = "autoqy_core.tools.analysis_gui:main"

[tool.setuptools]
packages = ["autoqy_core", "autoqy_core.tools"]

[tool.setuptools.package-data]
autoqy_core = [
  "assets/*.css",
  "assets/*.png",
  "assets/*.svg",
  "assets/icons/*.ico",
  "assets/icons/*.png",
  "assets/icons/*.svg"
]
